<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Uploaded Outfits Gallery</title>
    <link href="styles.css" rel="stylesheet" type="text/css">
    <script src="https://kit.fontawesome.com/ce069e7383.js" crossorigin="anonymous"></script>
    <style>
        body {
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        #imageGallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        #imageGallery img {
            width: 300px; /* adjust width as needed */
            height: auto;
            border: 2px solid #ccc;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Uploaded Outfits Gallery</h1>
    <div id="imageGallery"></div>

    <script>
        // Fetches the image data from Firebase Storage
        fetch('https://storage.googleapis.com/<your-bucket-name>/<file-path>') // Update with your Firebase Storage URL
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            // Assuming response is a URL to the image
            return response.text();
        })
        .then(imageUrl => {
            const gallery = document.getElementById('imageGallery');
            const imgElement = document.createElement('img');
            imgElement.src = imageUrl; // Set the src attribute to the URL of the image
            imgElement.alt = 'Uploaded Outfit';
            gallery.appendChild(imgElement);
        })
        .catch(error => {
            console.error('Error loading image:', error);
            const gallery = document.getElementById('imageGallery');
            gallery.innerText = 'Failed to load image.';
        });
    </script>
</body>
</html>
