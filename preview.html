<!DOCTYPE html>
<head>
    <link href="styles.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <div class = "wrapper">
        <form class = "upload-wrapper">
            <div class = "upload-container">
                <div class = "upload-img">
                     <img src = "images/upload.png" alt = "">
                </div> 		
	        <p class = "upload-text">Please choose an image to upload.</p>
	    </div>
                	
	    <div>
                <input type = "file" class = "visually-hidden" id = "upload-input">
                <button type = "button" class = "upload-btn" onchange="handleImageUpload()">Choose Image</button>
                <div id="dropdown-container">
                  <label for="dropdown">Select your Tag:</label>
                  <select id="dropdown">
                    <option value="blank">None</option>
                    <option value="optionShirt">Shirts</option>
                    <option value="optionJacket">Jackets</option>
                    <option value="optionPants">Pants</option>
                    <option value="optionShoes">Shoes</option>
                    <option value="optionNeutral">Neutral</option>
                    <option value="optionColorful">Colorful</option>
                    <option value="optionDenim">Denim</option>
                  </select>
                </div>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.3.js" integrity="sha256-nQLuAZGRRcILA+6dMBOvcRh5Pe310sBpanc6+QBmyVM=" crossorigin="anonymous"></script>
    <script src = "preview.js"></script>
    <input type="file" id="file-input" accept="image/*">
    <img id="image-container" />
    <script type="text/javascript">
    (function handleImageUpload(){
          /** @type {Node} */
      var imgInput = document.getElementById( "image-input" )
      var dropdownContainer = document.getElementById("dropdown-container")
          /** @type {Node} */
          imgContainer = document.getElementById( "image-container" ),

          /** Restore image src from local storage */
          updateUi = function() {
            imgContainer.src = window.localStorage.getItem( "image-base64" );
          },
          /** Register event listeners */
          bindUi = function(){
            imgInput.addEventListener( "change", function(){
              if ( this.files.length ) {
                var reader = new FileReader();
                reader.onload = function( e ){
                  window.localStorage.setItem( "image-base64", e.target.result );
                  updateUi();
                  dropdownContainer.style.display = 'block';
                };
                reader.readAsDataURL( this.files[ 0 ] );
              }
            }, false );
          };

    updateUi();
    bindUi();
    }());
    </script>
</div>
</body>
</html>
