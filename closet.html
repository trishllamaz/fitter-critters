<script>
var selectedImages = [];

$('.checkbox').change(function () {
  var imgSrc = $(this).data('img-src');
  if ($(this).is(':checked')) {
    selectedImages.push(imgSrc);
  } else {
    var index = selectedImages.indexOf(imgSrc);
    if (index !== -1) {
      selectedImages.splice(index, 1);
    }
  }
  updateSelectedImages();
});

function updateSelectedImages() {
  var selectedImagesHtml = '';
  for (var i = 0; i < selectedImages.length; i++) {
    selectedImagesHtml += '<img src="' + selectedImages[i] + '" style="margin-right: 10px;" width="200px" height="160px">';
  }
  $('#selectedImageContainer').html(selectedImagesHtml);
}

document.addEventListener('DOMContentLoaded', function () {
  const tagList = localStorage.getItem('tagList');

  if (tagList) {
    const tags = JSON.parse(tagList);
    const lastTag = tags[tags.length - 1]
    //const tags = JSON.parse(tagList).join(', '); <--- for multiple tags on one item
    document.getElementById('displayTags').textContent = lastTag;
  }
})

</script>

// On window load, load images from localStorage
window.onload = function() {
  $('.display').each(function() {
    var displayDiv = $(this);
    for (var i = 0; i < localStorage.length; i++) {
      var key = localStorage.key(i);
      if (key.startsWith('uploadedImage')) {
        var imageData = localStorage.getItem(key);
        var imgSrc = imageData;
        var imgElement = displayDiv.find("img");
        imgElement.attr("src", imgSrc);
        imgElement.attr("data-img-src", imgSrc);
      }
      document.getElementbyId("left")
    }
  });
};

</script>
