<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles_favorite.css">
  <link rel="stylesheet" href="styles.css">
  
</head>

<body>
  <div class="topnav">
    <a href=index.html> Back Home </a>
    <a class="active" href=closet.html> Your Closet </a>
  </div>
  <div id="closetfilter">
    <button class="btn" onclick="location.href='closet.html'"> Show all</button>
    <button class="btn active" onclick="location.href='favorite.html'"> Favorite</button>
  </div>

  <div class="saved_lists">
    <h1>Favorite</h1>
    <button type="button">Edit List</button>
    <h5>Saved Lists</h5>
    
  </div>

  <!-- Image Slider for outfits -->

  <div class="favDisplay" style="align-items: center;">
    <div class="saved-lists-container"></div>
  </div>

  

  
<script src="favorite.js"></script>

<script>

// Author: Patricia Tran
// Retrieve selected images from local storage
var selectedOutfits = JSON.parse(localStorage.getItem("selectedOutfits"));
console.log(selectedOutfits)
// Display
if (selectedOutfits) {
  var container = document.querySelector(".saved-lists-container");
  if (container) {
    container.style.display = "flex";
    container.style.flexDirection = "column";

    selectedOutfits.forEach(function(imageSrc) {
      var img = new Image();
      img.src = imageSrc;
      img.style.width = "200px"; 
      img.style.height = "200px";
      container.appendChild(img);
    });
  } else {
    console.error("Container not found");
  }
} else {
  console.error("No selected outfits found");
}







</script>
</body>

</html>
