<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <title>Upload Image Test</title>

    <script type="module">
        /* Here The Script For The Login Page Database */
    
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-storage.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    
        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyBB4ll9coIGqle-zOiQEiE1rPwPq95NDuE",
            authDomain: "fitter-critters.firebaseapp.com",
            projectId: "fitter-critters",
            storageBucket: "fitter-critters.appspot.com",
            messagingSenderId: "517864958606",
            appId: "1:517864958606:web:6604e725fb95fb5baa77df",
            measurementId: "G-T0K2M2RDJ7"
        };
    
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app)
        const storage = getStorage()
        console.log(app)
    
        // Submit Button
        function uploadImage() {
            const ref = app.storage().ref()
            const file = document.querySelector("#photo").files[0]
            const name = new Date() + '-' + file.name
            const metadata = {
                contentType: file.type
            }
            const task = ref.child(name).put(file, metadata)
    
            task
            .then(snapshot => snapshot.ref.getDownloadURL())
            .then(url => {
                console.log(url)
                alert("Image Upload Successful")
                const image = document.createElement('#image')
                image.src = url
            })
        }
        // Create the file metadata
        /** @type {any} */
        const metadata = {
            contentType: 'image/jpeg'
        };

        // Upload file and metadata to the object 'images/mountains.jpg'
        const storageRef = ref(storage, 'images/' + file.name);
        const uploadTask = uploadBytesResumable(storageRef, file, metadata);

        // Listen for state changes, errors, and completion of the upload.
        uploadTask.on('state_changed',
            (snapshot) => {
                // Get task progress, including the number of bytes uploaded and the total number of bytes to be uploaded
                const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                console.log('Upload is ' + progress + '% done');
                switch (snapshot.state) {
                    case 'paused':
                        console.log('Upload is paused');
                        break;
                    case 'running':
                        console.log('Upload is running');
                        break;
                }
            },
            (error) => {
                // A full list of error codes is available at
                // https://firebase.google.com/docs/storage/web/handle-errors
                switch (error.code) {
                    case 'storage/unauthorized':
                        // User doesn't have permission to access the object
                        break;
                    case 'storage/canceled':
                        // User canceled the upload
                        break;

                    // ...

                    case 'storage/unknown':
                        // Unknown error occurred, inspect error.serverResponse
                        break;
                }
            },
            () => {
                // Upload completed successfully, now we can get the download URL
                getDownloadURL(uploadTask.snapshot.ref).then((downloadURL) => {
                    console.log('File available at', downloadURL);
                });
            }
        );
    </script>
</head>

<body>
    <div class="wrapper">
        <form class="upload-wrapper">
            <div class="upload-container">
                <div class="upload-img">
                    <img id="preview-image" src="#" alt="">
                </div>
                <p class="upload-text">Please choose an image to upload.</p>

                <!-- File input field -->
                <input type="file" class="visually-hidden" id="image-upload" accept="image/*">

                <!-- File input button -->
                <label for="image-upload" class="upload-btn">Choose Image</label>
                <button class="upload-btn" onclick="uploadImage()">Submit</button>
            </div>
        </form>
    </div>
</body>

<script>
    window.onload = function() {
        var imageData = localStorage.getItem('uploadedImage');
        if (imageData) {
            document.getElementById('preview-image').src = imageData;
        }
    };
</script>
