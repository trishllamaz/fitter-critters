<!DOCTYPE html>
<head>
    <link href="styles.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="wrapper">
    <form class="upload-wrapper">
        <div class="upload-container">
            <div class="upload-img">
                <img id="preview-image" src="#" alt="">
            </div>
            <p class="upload-text">Please choose an image to upload.</p>
            
            <!-- File input field -->
            <input type="file" class="visually-hidden" id="image-upload" accept="image/*">

            <!-- File input button -->
            <label for="image-upload" class="upload-btn">Choose Image</label>

            <!-- Dropdown for selecting tags -->
            <div id="dropdown-container">
                <label for="dropdown">Select your Tag:</label>
                <select id="dropdown" multiple>
                    <option value="None">None</option>
                    <option value="Shirt">Shirts</option>
                    <option value="Jacket">Jackets</option>
                    <option value="Pants">Pants</option>
                    <option value="Shoes">Shoes</option>
                    <option value="Neutral">Neutral</option>
                    <option value="Colorful">Colorful</option>
                    <option value="Denim">Denim</option>
                </select>
            </div>
            <input type="button" value="Save" onclick="saveTags()">
            <input type="button" value="Delete" onclick="deleteImage()">
        </div>
    </form>
</div>
<script>
    // Author: Kylie Sodano
    // These functions serve to allow users to delete or edit their closet.
    // Delete the images removes them from local storage and the closet page
    window.onload = function() {
        var storedItem = JSON.parse(localStorage.getItem('selectedItem'));
        var imgSrc = storedItem.imageSrc;
        console.log(imgSrc)
        if (imgSrc) {
            document.getElementById('preview-image').src = imgSrc;
        }
    };

    function saveTags() {
        var selectedTags = [];
        var selectElement = document.getElementById("dropdown");
        var tagList = localStorage.getItem("tagList") ? JSON.parse(localStorage.getItem("tagList")) : [];

        for (var i = 0; i < selectElement.options.length; i++) {
            var option = selectElement.options[i];
            if (option.selected) {
                selectedTags.push(option.value);
            }
        }

        tagList.push(selectedTags);
        localStorage.setItem("tagList", JSON.stringify(tagList));
        window.location.href = "closet.html";
    }

    function handleImageUpload(event) {
        var file = event.target.files[0];
        var reader = new FileReader();
        
        reader.onload = function(e) {
            const imageData = e.target.result;
            const uploadedImages = JSON.parse(localStorage.getItem("uploadedImages")) || [];
            var storedItem = JSON.parse(localStorage.getItem('selectedItem'));
            const index = uploadedImages.indexOf(storedItem.imageSrc);
            if (index !== -1) {
                uploadedImages[index] = imageData;
            } else {
                uploadedImages.push(imageData);
            }
            localStorage.setItem("uploadedImages", JSON.stringify(uploadedImages));
            storedItem.imageSrc = imageData;
            localStorage.setItem('selectedItem', JSON.stringify(storedItem));
            document.getElementById('preview-image').src = imageData;
        }
        reader.readAsDataURL(file);
    }

    function deleteImage() {
        var storedItem = JSON.parse(localStorage.getItem('selectedItem'));
        var imgSrc = storedItem.imageSrc;
        var uploadedImages = JSON.parse(localStorage.getItem("uploadedImages")) || [];
        const index = uploadedImages.indexOf(imgSrc);
        if (index !== -1) {
            uploadedImages.splice(index, 1);
        }
        localStorage.setItem("uploadedImages", JSON.stringify(uploadedImages));
        localStorage.removeItem('selectedItem');
        window.location.href = "closet.html";
    }

    document.getElementById('image-upload').addEventListener('change', handleImageUpload);
</script>
</body>
</html>
