<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script type="module" defer>
        /* Here The Script For The Login Page Database */

        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

        // TODO: Add SDKs for Firebase products that you want to use
        // https://firebase.google.com/docs/web/setup#available-libraries

        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyBB4ll9coIGqle-zOiQEiE1rPwPq95NDuE",
            authDomain: "fitter-critters.firebaseapp.com",
            projectId: "fitter-critters",
            storageBucket: "fitter-critters.appspot.com",
            messagingSenderId: "517864958606",
            appId: "1:517864958606:web:6604e725fb95fb5baa77df",
            measurementId: "G-T0K2M2RDJ7"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app)

        // Login Butttons
        const login_submit = document.getElementById('login_submit');
        login_submit.addEventListener("click", function (event) {
            event.preventDefault()

            // Inputs
            const email = document.getElementById('login_email').value;
            const password = document.getElementById('login_password').value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Signed in 
                    const user = userCredential.user;
                    alert("Signing In...")
                    window.location.href = "closet.html";
                    // ...
                })
                .catch((error) => {
                    const errorCode = error.code;
                    const errorMessage = error.message;
                });
        })

        // Sign Up Button
        const signup_submit = document.getElementById('signup_submit');
        signup_submit.addEventListener("click", function (event) {
            event.preventDefault()

            // Inputs
            const email = document.getElementById('signup_email').value;
            const password = document.getElementById('signup_password').value;

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Signed up 
                    const user = userCredential.user;
                    alert("Creating Acount...")
                    window.location.href = "login.html";
                    // ...
                })
                .catch((error) => {
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    alert(errorMessage)
                    // ..
                });
        })
    </script>

    <title>Login As A Fitter</title>
</head>

<body>

    <div class="topnav">
        <a href=index.html> Back Home </a>
    </div>
    
    <div class="login_container" id="login_container">
        <div class="form-container sign-up">
            <form>
                <h1>Create Account</h1>
                <div class="social-icons">
                    <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-instagram"></i></a>
                </div>
                <span>or use your email for registeration</span>
                <input type="text" placeholder="Name" id="name">
                <input type="email" placeholder="Email" id="signup_email">
                <input type="password" placeholder="Password" id="signup_password">
                <button id="signup_submit">Sign Up</button>
            </form>
        </div>
        <div class="form-container sign-in">
            <form>
                <h1>Sign In</h1>
                <div class="social-icons">
                    <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-instagram"></i></a>
                </div>
                <span>or use your email password</span>
                <input type="email" placeholder="Email" id="login_email">
                <input type="password" placeholder="Password" id="login_password">
                <a href="#">Forget Your Password?</a>
                <button id="login_submit">Sign In</button>
            </form>
        </div>
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Welcome Back!</h1>
                    <p>Enter your personal details to use all of site features</p>
                    <button class="hidden" id="login">Sign In</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Hello, Fitter!</h1>
                    <p>Register with your personal details to use all of site features</p>
                    <button class="hidden" id="register">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* Here Is Script For The Login Page Interactivity Part */

        const container = document.getElementById('login_container');
        const registerBtn = document.getElementById('register');
        const loginBtn = document.getElementById('login');

        registerBtn.addEventListener('click', () => {
            container.classList.add("active");
        });

        loginBtn.addEventListener('click', () => {
            container.classList.remove("active");
        });
    </script>
</body>

</html>
